# Official DeepSeek services used by legacy public profiles. Desktop does not load this bundle.
- insert:
    - id: session-log-deepseek
      name: '@deepseek-ai/dsh-session-log-deepseek'

    - id: deepseek-account
      name: '@deepseek-ai/dsh-deepseek-account-platform'
      config:
        desktopPlatform: null

    # Ordinary activity does not upload Session logs; explicit feedback can
    # release a prefix to the configured official collector.
    - id: session-telemetry-otel
      name: '@deepseek-ai/dsh-session-telemetry-otel'
      config:
        mode: !!js process.env.DSH_TELEMETRY_MODE || 'FEEDBACK_ONLY'
        shutdownTimeoutMillis: 3000
        exporter:
          url: !!js process.env.DSH_TELEMETRY_OTLP_URL ?? 'https://harness-telemetry.deepseeksvc.com/v1/logs'
          compression: gzip
          timeoutMillis: 1000
        processor:
          scheduledDelayMillis: 10000
          maxQueueSize: 2048
          maxExportBatchSize: 2048
          exportTimeoutMillis: 1500

    - id: command-feedback
      name: '@deepseek-ai/dsh-command-feedback'

    - id: message-feedback
      name: '@deepseek-ai/dsh-message-feedback'
      config:
        maxNoteBytes: 8192

    - id: ui-settings-account
      name: '@deepseek-ai/dsh-client-ui-settings-account'

    - id: account-controller
      name: '@deepseek-ai/dsh-api-account-controller'

    - id: ui-brand-official
      name: '@deepseek-ai/dsh-client-ui-brand-official'

    - id: ui-message-feedback
      name: '@deepseek-ai/dsh-client-ui-message-feedback'
