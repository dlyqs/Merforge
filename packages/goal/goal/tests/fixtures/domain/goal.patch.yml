# Test-only patch over the Desktop base bundle, which supplies the goal domain,
# model tools, and agent runtime.

- id: goal
  config:
    defaultMaxGoalRounds: 11

- id: agent-loop
  config:
    agents:
      - id: main
        provider: cli-mock
        model: cli-mock
        cwd: !!js process.cwd()

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- insert:
    - id: cli-mock-llm
      name: '../../../../../test-support/loader-smoke/tests/fixtures/cli-mock-llm.ts'

    - id: seed-goal
      name: './seed-goal.ts'
