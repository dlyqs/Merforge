# Test-only patch over the Desktop base bundle's agent and persistence rows.

- id: agent-loop
  config:
    agents:
      - id: main
        provider: time-context-mock
        model: time-context-mock
        cwd: !!js process.cwd()

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- insert:
    - id: time-context-mock-llm
      name: './mock-llm.ts'

    - id: time-context
      name: '@deepseek-ai/dsh-time-context'
